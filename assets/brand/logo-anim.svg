<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" role="img" aria-label="21 World">
  <style>
    .ring { transform-origin: 50px 50px; animation: spin 16s linear infinite; }
    .glow { transform-origin: 50px 50px; animation: pulse 3.2s ease-in-out infinite; }
    .sheen { animation: sweep 4.5s cubic-bezier(.45,0,.2,1) infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    @keyframes pulse { 0%, 100% { opacity: .0; transform: scale(.96); } 50% { opacity: .55; transform: scale(1.02); } }
    @keyframes sweep { 0%, 55% { transform: translateX(-70px); } 85%, 100% { transform: translateX(70px); } }
    @media (prefers-reduced-motion: reduce) { .ring, .glow, .sheen { animation: none; } .glow { opacity: 0; } }
  </style>
  <defs>
    <radialGradient id="felt" cx="50%" cy="38%" r="65%"><stop offset="0" stop-color="#1d6a4a"/><stop offset="1" stop-color="#0b3326"/></radialGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffe9a8"/><stop offset=".45" stop-color="#f2b33d"/><stop offset="1" stop-color="#b9781a"/></linearGradient>
    <linearGradient id="red" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#d23a3f"/><stop offset="1" stop-color="#7e1418"/></linearGradient>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="1.5" stdDeviation="1.2" flood-color="#000" flood-opacity=".55"/></filter>
    <radialGradient id="halo" cx="50%" cy="50%" r="50%"><stop offset=".62" stop-color="#ffd76a" stop-opacity="0"/><stop offset=".8" stop-color="#ffd76a" stop-opacity=".7"/><stop offset="1" stop-color="#ffd76a" stop-opacity="0"/></radialGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff" stop-opacity=".75"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
    <clipPath id="felt-clip"><circle cx="50" cy="50" r="31.5"/></clipPath>
  </defs>
  <circle class="glow" cx="50" cy="50" r="50" fill="url(#halo)"/>
  <g class="ring">
  <circle cx="50" cy="50" r="48" fill="url(#red)"/>
  <g fill="#f6f1e6">
    <rect x="45.5" y="2" width="9" height="12" rx="2"/><rect x="45.5" y="86" width="9" height="12" rx="2"/>
    <rect x="45.5" y="2" width="9" height="12" rx="2" transform="rotate(45 50 50)"/><rect x="45.5" y="86" width="9" height="12" rx="2" transform="rotate(45 50 50)"/>
    <rect x="45.5" y="2" width="9" height="12" rx="2" transform="rotate(90 50 50)"/><rect x="45.5" y="86" width="9" height="12" rx="2" transform="rotate(90 50 50)"/>
    <rect x="45.5" y="2" width="9" height="12" rx="2" transform="rotate(135 50 50)"/><rect x="45.5" y="86" width="9" height="12" rx="2" transform="rotate(135 50 50)"/>
  </g>
  <circle cx="50" cy="50" r="48" fill="none" stroke="#3a0709" stroke-opacity=".5" stroke-width="1.2"/>
  </g>
  <circle cx="50" cy="50" r="35" fill="url(#gold)"/>
  <circle cx="50" cy="50" r="35" fill="none" stroke="#7a4b0c" stroke-width="1" stroke-dasharray="2.2 2.2"/>
  <circle cx="50" cy="50" r="31.5" fill="url(#felt)"/>
  <circle cx="50" cy="50" r="31.5" fill="none" stroke="#000" stroke-opacity=".35" stroke-width="1.4"/>
  <g filter="url(#sh)" fill="none" stroke="url(#gold)" stroke-width="7.2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M30.5 40.5 C30.5 32 43.5 30 46.5 37 C49 43 41 49.5 31 62.5 L48 62.5"/>
    <path d="M58 37.5 L65 32.5 L65 63"/>
  </g>
  <path d="M72 60.5 l3.2-5.5 3.2 5.5z M75.2 61 v2.4" fill="url(#gold)" stroke="url(#gold)" stroke-width="1.2" stroke-linejoin="round" opacity=".9"/>
  <g clip-path="url(#felt-clip)"><rect class="sheen" x="20" y="10" width="22" height="80" fill="url(#shine)" transform="skewX(-18)" opacity=".55"/></g>
</svg>
